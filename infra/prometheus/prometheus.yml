# Scrapes every service's /metrics (traffic_common.telemetry, METRICS_PORT 9100 inside the
# compose network; the api serves it on its own port). The job label names the service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: video_ingest
    static_configs: [{ targets: ["video_ingest:9100"] }]
  - job_name: event_simulator
    static_configs: [{ targets: ["event_simulator:9100"] }]
  - job_name: cv_inference
    static_configs: [{ targets: ["cv_inference:9100"] }]
  - job_name: nlp_service
    static_configs: [{ targets: ["nlp_service:9100"] }]
  - job_name: anomaly_service
    static_configs: [{ targets: ["anomaly_service:9100"] }]
  - job_name: fusion_service
    static_configs: [{ targets: ["fusion_service:9100"] }]
  - job_name: summarizer
    static_configs: [{ targets: ["summarizer:9100"] }]
  - job_name: ml-monitor
    static_configs: [{ targets: ["ml-monitor:9100"] }]
  - job_name: api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
