# Optional: lets the plain `alembic` CLI work, e.g. `alembic -c shared/alembic.ini upgrade head`.
# `python -m traffic_common.db ...` does the same without this file.
# The database URL comes from POSTGRES_URL (see migrations/env.py), not from this file.

[alembic]
script_location = traffic_common.db:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
