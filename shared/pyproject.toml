[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-common"
version = "0.2.0"
description = "Shared utilities for the Real-Time Multimodal Traffic Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "confluent-kafka>=2.5,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic migration template and revisions ship inside the package so migrations run from the images.
traffic_common = ["db/migrations/script.py.mako", "db/migrations/versions/*.py"]
